<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF 투자트렌드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Malgun Gothic","Noto Sans CJK KR",sans-serif; }
  body { background:#e9ebf0; display:flex; justify-content:center; }
  #phone { width:100%; max-width:420px; min-height:100vh; background:#fff; position:relative; box-shadow:0 0 24px rgba(30,34,60,.12); }
  /* ===== 홈/목록 헤더 (네이비) ===== */
  .hdr { display:flex; align-items:center; gap:10px; padding:13px 14px; background:#383c6c; color:#a9acd0; font-size:13px; position:sticky; top:0; z-index:10; }
  .hdr .back { cursor:pointer; font-size:16px; color:#fff; }
  .hdr .t-dim { font-weight:600; cursor:default; }
  .hdr .t-on { color:#fff; font-weight:800; font-size:14px; }
  /* ===== 상세 헤더 (화이트) ===== */
  .dhdr { display:flex; align-items:center; padding:12px 14px; background:#fff; border-bottom:1px solid #eef0f4; position:sticky; top:0; z-index:10; }
  .dhdr .dt { flex:1; text-align:center; font-size:15px; font-weight:800; color:#1a1a1a; }
  .dhdr .ic { width:34px; height:30px; border:none; background:none; font-size:16px; color:#3d434c; cursor:pointer; }
  /* ===== 공통 ===== */
  .sec { padding:16px 18px 6px; color:#111; font-size:16.5px; font-weight:800; }
  .sec .cnt2 { font-size:11px; color:#9aa1ac; font-weight:600; margin-left:6px; }
  .divide { height:8px; background:#f4f5f8; }
  .badge { display:inline-block; font-size:10px; font-weight:800; border-radius:4px; padding:2.5px 7px; }
  .trow { display:flex; align-items:center; gap:13px; padding:12px 18px; cursor:pointer; }
  .trow:active { background:#f7f8fa; }
  .trow .tx { flex:1; min-width:0; }
  .trow .tt { color:#1a1a1a; font-size:14.5px; font-weight:800; line-height:1.4; margin-top:5px; }
  .trow .tt mark { background:none; color:#e8332b; }
  .kchips { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .kchip { font-size:10px; color:#8a8f98; background:#f1f3f7; border-radius:10px; padding:2px 8px; font-weight:700; }
  .kchip.match { color:#e8332b; background:#fdecea; }
  .th2 { width:64px; height:64px; border-radius:12px; flex:none; background:#eef1f6; display:flex; align-items:center; justify-content:center; color:#aab0bc; font-size:9.5px; font-weight:800; overflow:hidden; }
  .th2 img { width:100%; height:100%; object-fit:cover; }
  .morerow { text-align:center; color:#4a5568; font-size:13px; font-weight:700; padding:13px 0 15px; cursor:pointer; }
  .morerow:active { background:#f7f8fa; }
  /* 시리즈 카드 */
  .scard { padding:8px 18px 18px; cursor:pointer; }
  .scard .hero { height:150px; border-radius:13px; overflow:hidden; background:linear-gradient(135deg,#dfe7f4,#c3d3ec); display:flex; align-items:center; justify-content:center; color:#4a6491; font-size:14px; font-weight:800; margin-bottom:10px; position:relative; }
  .scard .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scard .sn { color:#111; font-size:15.5px; font-weight:800; }
  .scard .sd { color:#8a8f98; font-size:12px; margin-top:3px; line-height:1.5; }
  .scard .sc { color:#9aa1ac; font-size:11px; margin-top:5px; }
  /* 검색 + 칩 */
  .searchbar { display:flex; align-items:center; gap:8px; margin:10px 18px 4px; background:#f1f3f7; border-radius:11px; padding:10px 13px; }
  .searchbar input { flex:1; background:none; border:none; outline:none; color:#1a1a1a; font-size:13px; }
  .searchbar input::placeholder { color:#9aa1ac; }
  .searchbar .go { background:#383c6c; color:#fff; font-size:11px; font-weight:800; border:none; border-radius:7px; padding:6px 13px; cursor:pointer; }
  .catchips { display:flex; gap:7px; padding:10px 18px 4px; overflow-x:auto; scrollbar-width:none; }
  .catchips::-webkit-scrollbar { display:none; }
  .cat { font-size:12px; color:#4a5568; border:1px solid #d9dde3; border-radius:16px; padding:6px 13px; font-weight:700; cursor:pointer; white-space:nowrap; flex:none; background:#fff; }
  .cat.on { color:#fff; background:#383c6c; border-color:#383c6c; }
  .rescnt { font-size:11.5px; color:#8a8f98; padding:8px 18px 0; }
  /* ===== 상세 ===== */
  .d-title { padding:18px 18px 2px; font-size:19px; font-weight:800; color:#1a1a1a; line-height:1.4; }
  .d-date { padding:0 18px; font-size:11px; color:#a2a7b0; margin:6px 0 12px; }
  .sumbox { margin:0 18px 14px; background:#f4f6fa; border-left:3px solid #383c6c; border-radius:0 9px 9px 0; padding:11px 13px; font-size:12.5px; color:#3d434c; line-height:1.6; font-weight:600; }
  .d-body { padding:2px 18px 10px; font-size:14.5px; color:#333; line-height:1.78; }
  .d-body img { max-width:100%; border-radius:10px; }
  .d-body h3 { color:#2e6be6; margin:14px 0 7px; font-size:15.5px; }
  .d-body p { margin-bottom:11px; }
  .sect { padding:18px 18px 4px; font-size:14.5px; font-weight:800; color:#1a1a1a; }
  .etf-card { display:flex; align-items:center; border:1px solid #e6e9ef; border-radius:11px; margin:8px 18px; padding:12px 13px; cursor:pointer; }
  .etf-card:active { background:#f7f8fa; }
  .etf-ic { width:32px; height:32px; border-radius:50%; background:#383c6c; color:#fff; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-right:11px; flex:none; }
  .etf-nm { flex:1; }
  .etf-nm .n { font-size:13px; font-weight:700; color:#222; }
  .etf-nm .c { font-size:10.5px; color:#a2a7b0; margin-top:1px; }
  .golink { color:#2e6be6; font-size:12.5px; font-weight:800; }
  .btn-line { display:block; margin:11px 18px 0; border:1px solid #c9cdd6; border-radius:10px; text-align:center; padding:12px 0; font-size:13px; font-weight:700; color:#3d434c; background:#fff; cursor:pointer; width:calc(100% - 36px); }
  .btn-cta { display:block; margin:12px 18px 0; border-radius:10px; border:none; width:calc(100% - 36px); text-align:center; padding:13px 0; font-size:13.5px; font-weight:800; color:#fff; background:#383c6c; cursor:pointer; }
  /* 상세 상단 히어로 — ③ 메인 이미지 위 타이틀 오버레이 (권장 1080×600) */
  .hero-img { position:relative; width:100%; aspect-ratio:1080/600; background:#eef1f6; overflow:hidden; }
  .hero-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero-img .hgrad { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(10,14,30,.62) 100%); }
  .hero-img .htitle { position:absolute; left:18px; right:18px; bottom:16px; color:#fff; font-size:20px; font-weight:800; line-height:1.4; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  .dtags { display:flex; flex-wrap:wrap; gap:7px; padding:4px 18px 2px; }
  .dtag { font-size:11.5px; color:#2e6be6; background:#eaf1fe; border:none; border-radius:14px; padding:5px 11px; font-weight:700; cursor:pointer; }
  .sumbox .slabel { display:block; font-size:12px; font-weight:800; color:#383c6c; margin-bottom:5px; }
  .btn-pdf { display:block; margin:14px 18px 0; border:none; border-radius:10px; text-align:center; padding:13px 0; font-size:13px; font-weight:800; color:#2e6be6; background:#eaf1fe; cursor:pointer; width:calc(100% - 36px); }
  /* 관련 ETF — 카드 캐러셀 (시안 반영) */
  .etfroll { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:8px 18px 2px; scrollbar-width:none; }
  .etfroll::-webkit-scrollbar { display:none; }
  .ecard { flex:none; width:80%; scroll-snap-align:center; border:1px solid #d9dde3; border-radius:13px; padding:14px 15px 13px; cursor:pointer; background:#fff; }
  .ecard:active { background:#f7f8fa; }
  .ebadge { display:inline-block; font-size:10px; font-weight:800; border-radius:10px; padding:2.5px 9px; border:1px solid; margin-right:6px; }
  .ecard .enm { font-size:15px; font-weight:800; color:#1a1a1a; margin:10px 0 2px; line-height:1.35; }
  .ecard .ecd { font-size:11.5px; color:#6b7280; }
  .ecard .eret { text-align:right; margin-top:8px; font-size:11.5px; color:#5f6672; }
  .ecard .eret b { font-size:17px; font-weight:800; margin-left:6px; }
  .edots { display:flex; gap:6px; justify-content:center; padding:9px 0 2px; }
  .edots i { width:14px; height:4px; border-radius:2px; background:#d9dde3; }
  .edots i.on { background:#383c6c; }
  /* 추천 */
  .rate-wrap { text-align:center; padding:20px 0 6px; border-top:8px solid #f4f5f8; margin-top:20px; }
  .rate-q { font-size:14.5px; font-weight:800; color:#1a1a1a; }
  .rate-n { font-size:12px; color:#8a8f98; margin:6px 0 11px; }
  .rate-n b { color:#2e6be6; }
  .rate-btn { border:1.5px solid #383c6c; background:#fff; border-radius:20px; padding:9px 30px; font-size:13px; font-weight:800; color:#383c6c; cursor:pointer; }
  .rate-btn.done { background:#383c6c; color:#fff; cursor:default; }
  /* 인기글 */
  .poprow { display:flex; align-items:center; gap:13px; margin:10px 18px; cursor:pointer; }
  .poprow:active { background:#f7f8fa; }
  .poprow .pthumb { width:64px; height:64px; border-radius:10px; overflow:hidden; flex:none; background:#eef1f6; display:flex; align-items:center; justify-content:center; color:#aab0bc; font-size:9px; font-weight:800; }
  .poprow .pthumb img { width:100%; height:100%; object-fit:cover; }
  .poprow .t { font-size:13.5px; font-weight:800; color:#1a1a1a; line-height:1.4; }
  .poprow .d { font-size:11px; color:#6b7280; margin-top:3px; }
  /* 알아두세요 / 심사필 */
  .notice { background:#f6f7f9; padding:15px 18px 8px; margin-top:16px; }
  .notice .nt { font-size:12.5px; font-weight:800; color:#5f6672; margin-bottom:7px; }
  .notice p { font-size:10.5px; color:#8a8f98; line-height:1.65; margin-bottom:5px; }
  .simsa { font-size:10.5px; font-weight:700; color:#5f6672; padding:6px 18px 20px; background:#f6f7f9; }
  .empty { color:#9aa1ac; font-size:12.5px; text-align:center; padding:36px 0; line-height:1.7; }
  /* PDF 팝업 */
  #pdfpop { position:fixed; inset:0; background:rgba(20,24,38,.55); display:none; justify-content:center; align-items:flex-start; z-index:30; }
  #pdfpop .box { width:92%; max-width:400px; margin-top:7vh; background:#fff; border-radius:15px; overflow:hidden; box-shadow:0 12px 34px rgba(0,0,0,.35); }
  #pdfpop .ph { display:flex; align-items:center; padding:12px 15px; border-bottom:1px solid #f0f1f4; }
  #pdfpop .pt { flex:1; font-size:13px; font-weight:800; color:#222; }
  .xbtn { width:27px; height:27px; border-radius:50%; background:#f1f3f7; border:none; font-size:12px; font-weight:800; cursor:pointer; color:#3d434c; }
  #pdfpop iframe { width:100%; height:64vh; border:none; background:#e8ebf1; }
  /* 공유 바텀시트 */
  #sharepop { position:fixed; inset:0; background:rgba(20,24,38,.45); display:none; justify-content:center; align-items:flex-end; z-index:30; }
  #sharepop .sheet { width:100%; max-width:420px; background:#fff; border-radius:18px 18px 0 0; padding:16px 18px 26px; }
  #sharepop .sh { display:flex; align-items:center; margin-bottom:14px; }
  #sharepop .st { flex:1; font-size:15px; font-weight:800; color:#1a1a1a; }
  .share-row { display:flex; gap:12px; }
  .share-it { flex:1; border:1px solid #e6e9ef; border-radius:12px; padding:14px 0 11px; text-align:center; cursor:pointer; background:#fff; }
  .share-it:active { background:#f7f8fa; }
  .share-it .em { font-size:22px; }
  .share-it .lb { font-size:11px; font-weight:700; color:#3d434c; margin-top:6px; }
  /* 숏츠 (관리자 미리보기용 — 홈 미노출) */
  .shgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; padding:10px 18px 20px; }
  .shcard { cursor:pointer; }
  .thv { width:100%; aspect-ratio:9/16; border-radius:12px; background:#eef1f6; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#aab0bc; font-size:10px; font-weight:800; }
  .thv img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .shcard .st2 { color:#1a1a1a; font-size:12px; font-weight:700; margin-top:6px; line-height:1.35; }
  .pwrap { background:#000; display:flex; justify-content:center; }
  .pwrap iframe { width:100%; max-width:min(420px, 72vh * 9 / 16); aspect-ratio:9/16; max-height:72vh; border:none; display:block; }
  /* 네이티브 화면 시뮬레이션 (종목 상세 / ETF 탐색) */
  .npop { position:fixed; inset:0; display:none; justify-content:center; z-index:40; background:rgba(0,0,0,.3); }
  .npop .nframe { width:100%; max-width:420px; height:100vh; background:#0d0e14; color:#fff; display:flex; flex-direction:column; overflow:hidden; }
  .npop .nscroll { flex:1; overflow-y:auto; }
  .nsb { background:#0d0e14; color:#fff; font-size:11px; display:flex; justify-content:space-between; padding:6px 16px 2px; }
  .ntag { font-size:8.5px; font-weight:800; color:#9aa1ac; border:1px solid #3a3d4d; border-radius:4px; padding:1px 6px; }
  .shdr { display:flex; align-items:flex-start; padding:16px 16px 0; }
  .shdr .snm { flex:1; text-align:center; }
  .shdr .scode { font-size:12px; color:#8a8f98; }
  .shdr .sname { font-size:19px; font-weight:800; margin-top:2px; }
  .shdr .nx { font-size:20px; color:#fff; background:none; border:none; cursor:pointer; padding:4px 2px; }
  .sbdg { display:inline-block; font-size:10.5px; font-weight:800; border-radius:12px; padding:4px 10px; margin-right:6px; }
  .sprice { padding:10px 16px 0; }
  .sprice .pv { font-size:34px; font-weight:800; color:#f04452; }
  .sprice .pc { font-size:13px; color:#f04452; margin-top:2px; }
  .sinav { display:flex; justify-content:space-between; padding:12px 16px; font-size:12.5px; color:#8a8f98; border-bottom:1px solid #22242e; }
  .stabs { display:flex; gap:4px; padding:10px 12px; align-items:center; }
  .stab { font-size:13px; font-weight:700; color:#8a8f98; padding:7px 14px; border-radius:9px; }
  .stab.on { background:#22242e; color:#fff; }
  .schart svg { width:100%; display:block; }
  .sxaxis { display:flex; justify-content:space-between; padding:2px 20px 10px; font-size:11px; color:#8a8f98; }
  .stabs2 { display:flex; gap:20px; padding:12px 18px 0; border-top:1px solid #22242e; }
  .stab2 { font-size:14px; font-weight:700; color:#8a8f98; padding-bottom:10px; }
  .stab2.on { color:#fff; border-bottom:2px solid #fff; }
  .soverview { padding:16px 18px; border-top:1px solid #22242e; }
  .soverview .ot { font-size:15px; font-weight:800; margin-bottom:10px; }
  .soverview .ob { font-size:13.5px; color:#c9cdd6; line-height:1.7; }
  .sbtns { display:flex; gap:9px; padding:12px 16px 16px; border-top:1px solid #22242e; }
  .sbtns .b1 { width:52px; border-radius:11px; background:#1b2340; color:#fff; border:none; font-size:16px; cursor:pointer; }
  .sbtns .b2 { flex:1; border-radius:11px; background:none; color:#fff; border:1px solid #3a3d4d; padding:14px 0; font-size:14px; font-weight:800; cursor:pointer; }
  .sbtns .b3 { flex:1.4; border-radius:11px; background:#2a3878; color:#fff; border:none; padding:14px 0; font-size:14px; font-weight:800; cursor:pointer; }
  .ehdr2 { display:flex; align-items:center; gap:16px; padding:14px 16px; font-size:14px; color:#8a8f98; font-weight:700; }
  .ehdr2 .eback { color:#fff; font-size:18px; cursor:pointer; }
  .ehdr2 .eon { color:#fff; font-weight:800; }
  .ecardk { background:#181a23; border-radius:16px; margin:10px 14px; padding:18px 16px; }
  .ecardk .et { font-size:17px; font-weight:800; }
  .esearch { display:flex; border:1.5px solid #8b5cf6; border-radius:12px; padding:11px 13px; margin-top:14px; color:#6a6f7e; font-size:13px; }
  .echips { display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; }
  .echip { font-size:12px; color:#c9cdd6; border:1px solid #2e3140; border-radius:17px; padding:7px 13px; font-weight:700; cursor:pointer; }
  .ebanner { background:#141c3a; border-radius:16px; margin:4px 14px 10px; padding:17px 16px; font-size:16px; font-weight:800; cursor:pointer; }
  .etheme { background:#181a23; border-radius:16px; margin:0 14px 14px; padding:16px; }
  .etheme .tt2 { font-size:15.5px; font-weight:800; margin-bottom:12px; }
  .etheme .trow2 { display:flex; gap:10px; }
  .ethm { flex:1; background:#20222d; border-radius:12px; padding:12px; cursor:pointer; }
  .ethm .rk { font-size:10.5px; font-weight:800; background:#0d0e14; border-radius:10px; padding:3px 9px; display:inline-block; }
  .ethm .tn { font-size:14px; font-weight:800; margin-top:9px; }
  .ethm .tr { font-size:12px; color:#f04452; font-weight:700; margin-top:3px; }
  /* 카카오톡 전송 미리보기 */
  #kakaopop { position:fixed; inset:0; background:rgba(20,24,38,.55); display:none; justify-content:center; align-items:center; z-index:45; }
  #kakaopop .kbox { width:88%; max-width:340px; }
  .kkwrap { background:#9bbbd4; border-radius:16px; padding:14px 14px 16px; }
  .kkhead { font-size:12px; font-weight:800; color:#2f4a5e; margin-bottom:10px; }
  .kkcard { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.18); }
  .kkimg { height:150px; background:#dfe7f4; display:flex; align-items:center; justify-content:center; color:#4a6491; font-size:12px; font-weight:800; overflow:hidden; }
  .kkimg img { width:100%; height:100%; object-fit:cover; }
  .kkbody { padding:12px 14px 10px; }
  .kkt { font-size:14px; font-weight:800; color:#1a1a1a; line-height:1.4; }
  .kkd { font-size:12px; color:#5f6672; line-height:1.55; margin-top:5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .kkfoot { font-size:10.5px; color:#8a8f98; padding:0 14px 10px; }
  .kkview { display:block; width:100%; border:none; border-top:1px solid #eceef2; background:#f7f8fa; padding:11px 0; font-size:12.5px; font-weight:800; color:#3d434c; cursor:pointer; }
  .kkbtns { display:flex; gap:9px; margin-top:13px; }
  .kkbtns button { flex:1; border:none; border-radius:10px; padding:11px 0; font-size:12.5px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="phone"><div id="view"></div></div>

<div id="pdfpop"><div class="box">
  <div class="ph"><div class="pt" id="pdf-title">원문 리포트</div><button class="xbtn" onclick="closePdf()">✕</button></div>
  <iframe id="pdf-frame"></iframe>
</div></div>

<div id="sharepop" onclick="if(event.target===this)closeShare()"><div class="sheet">
  <div class="sh"><div class="st">공유하기</div><button class="xbtn" onclick="closeShare()">✕</button></div>
  <div class="share-row">
    <div class="share-it" onclick="shareKakao()"><div class="em">💬</div><div class="lb">카카오톡</div></div>
    <div class="share-it" onclick="shareLink()"><div class="em">🔗</div><div class="lb">링크 복사</div></div>
  </div>
</div></div>

<!-- 카카오톡 전송 미리보기 — 이미지=③ 메인 이미지 · 제목=② · 설명=④ SUMMARY -->
<div id="kakaopop" onclick="if(event.target===this)this.style.display='none'"><div class="kbox">
  <div class="kkwrap">
    <div class="kkhead">카카오톡 전송 미리보기</div>
    <div class="kkcard" id="kkcard"></div>
    <div class="kkbtns">
      <button style="background:#fee500; color:#3c1e1e;" onclick="document.getElementById('kakaopop').style.display='none'; alert('카카오톡 전송 완료 (파일럿 시뮬레이션)\n실서비스: 카카오 공유 SDK — og 메타(③·②·④)')">전송</button>
      <button style="background:#4a5a68; color:#fff;" onclick="document.getElementById('kakaopop').style.display='none'">닫기</button>
    </div>

let rollT = null;
const ETF_R3 = { "487550":"+8.42%", "458730":"+2.15%", "091160":"+15.30%", "069500":"+3.41%",

const R3_ASOF = "26.10.27";
function startRoll(){
  clearInterval(rollT);
  const el = document.getElementById("etfroll"), dots = document.getElementById("edots");
  if(!el) return;
  const n = el.children.length;
  if(dots) dots.innerHTML = n>1 ? Array.from({length:n},(_,i)=>`<i class="${i===0?'on':''}"></i>`).join("") : "";
  if(n < 2) return;
  const step = () => el.children[0].offsetWidth + 10;
  const idx = () => Math.round(el.scrollLeft / step());
  el.onscroll = () => { if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle("on", i===idx())); };
  rollT = setInterval(()=>{ el.scrollTo({left: ((idx()+1)%n)*step(), behavior:"smooth"}); }, 3000);
  el.addEventListener("pointerdown", ()=>clearInterval(rollT), {once:true});
}

}

// ---------- 숏츠 (관리자 미리보기용 — 홈 진입 없음) ----------
const shThumb = vid => `<img src="https://i.ytimg.com/vi/${vid}/oardefault.jpg" onerror="if(!this.dataset.f){this.dataset.f=1; this.src='https://i.ytimg.com/vi/${vid}/hqdefault.jpg';}else{this.remove();}">`;
async function vShorts(){
  SERIES = await api("/api/series");
  const rows = await api("/api/contents?fmt=shorts");
  $v.innerHTML = hdr(true) + `<div class="sec">ETF 숏츠 <span class="cnt2">총 ${rows.length}개</span></div>
    <div class="shgrid">${rows.map(c=>`<div class="shcard" onclick="location.hash='#short/${c.id}'">
      <div class="thv">숏츠${c.video_id?shThumb(c.video_id):""}</div><div class="st2">${esc(c.title)}</div></div>`).join("")}</div>` +
    (rows.length?"":`<div class="empty">노출 중인 숏츠가 없습니다</div>`);
}
async function vShort(id){
  SERIES = await api("/api/series");
  const c = await api(`/api/contents/${id}?view=1`);
  $v.innerHTML = dhdr(c.series_name) + `
    <div class="pwrap"><iframe src="https://www.youtube.com/embed/${c.video_id}?autoplay=1&mute=1&playsinline=1&rel=0&loop=1&playlist=${c.video_id}"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="sec" style="font-size:15px;">${esc(c.title)}</div>
    <div style="padding:2px 18px 20px;">${badge(c.series_id, c.series_name)} <span style="font-size:11px; color:#a2a7b0;"> ${dt(c.start_at)} · 조회 ${c.views.toLocaleString()}</span></div>`;
  window.scrollTo(0,0);
}

// ---------- 라우터 ----------
function route(){
  const h = location.hash || "#home";
  const [path, qs] = h.slice(1).split("?");
  const p = new URLSearchParams(qs||"");
  if(path.startsWith("short/")) return vShort(path.split("/")[1]);
  if(path.startsWith("shorts")) return vShorts();
  if(path.startsWith("post/")) return vPost(path.split("/")[1]);
  if(path.startsWith("series/")) return vList("", path.split("/")[1]); // 구버전 링크 호환
  if(path.startsWith("list")) return vList(p.get("q")||"", p.get("s")||0);
  return vHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
